name: Dist check 📦

# This package is consumed as a git dependency (github:omnidotdev/editor#<tag>),
# so its built output under build/ is committed. Guard against a stale dist: rebuild
# and fail if the result differs from what is checked in.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  dist:
    name: Verify committed build is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Rebuild
        run: bun run build
      - name: Ensure build/ is up to date
        run: |
          if ! git diff --quiet -- build/; then
            echo "::error::build/ is stale. Run 'bun run build' and commit the result."
            git diff --stat -- build/
            exit 1
          fi
